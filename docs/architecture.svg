<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="460" viewBox="0 0 1040 460" role="img" aria-labelledby="title desc">
  <title id="title">AI cold calling agent architecture</title>
  <desc id="desc">CSV leads pass through guards and a paced dialer to Twilio. Signed callbacks and audio reach FastAPI, which bridges to Realtime and executes tools with persistent state.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <rect width="1040" height="460" rx="16" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#0f172a">
    <text x="36" y="42" font-size="24" font-weight="bold">Outbound calls with explicit safety checks</text>
    <text x="36" y="68" font-size="15" fill="#475569">Dry run by default. Shared local state. Signed Twilio callbacks.</text>
    <g fill="#ffffff" stroke="#94a3b8" stroke-width="1.5">
      <rect x="35" y="110" width="170" height="90" rx="10"/>
      <rect x="265" y="110" width="190" height="90" rx="10"/>
      <rect x="515" y="110" width="190" height="90" rx="10"/>
      <rect x="765" y="110" width="230" height="90" rx="10"/>
      <rect x="35" y="310" width="220" height="100" rx="10"/>
      <rect x="330" y="310" width="250" height="100" rx="10"/>
      <rect x="690" y="310" width="305" height="100" rx="10"/>
    </g>
    <g font-size="18" font-weight="bold" text-anchor="middle">
      <text x="120" y="143">CSV + campaign</text><text x="360" y="143">Guards + dialer</text>
      <text x="610" y="143">Twilio Voice</text><text x="880" y="143">FastAPI bridge</text>
      <text x="145" y="344">State + results</text><text x="455" y="344">Shared tools</text>
      <text x="842" y="344">OpenAI Realtime GA</text>
    </g>
    <g font-size="14" text-anchor="middle" fill="#334155">
      <text x="120" y="170">Consent, timezone, script</text><text x="360" y="170">Window, DNC, attempts</text>
      <text x="610" y="170">Async AMD + Media Stream</text><text x="880" y="170">Signature + call identity</text>
      <text x="145" y="370">SQLite, CSV, JSONL, DNC</text><text x="455" y="370">Answers, booking, opt-out</text>
      <text x="455" y="391">Webhook or local booking file</text><text x="842" y="370">Speech + function calls</text>
      <text x="842" y="391">PCMU audio in both directions</text>
    </g>
    <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M205 155H260"/><path d="M455 155H510"/><path d="M705 155H760"/>
      <path d="M880 200V305" marker-start="url(#arrow)"/>
      <path d="M690 360H585"/><path d="M330 360H260"/>
      <path d="M360 200V250H145V305"/>
    </g>
    <text x="892" y="258" font-size="14">Audio</text>
    <text x="371" y="238" font-size="14">Persistent attempts</text>
    <text x="610" y="346" font-size="14">Tools</text>
  </g>
</svg>
